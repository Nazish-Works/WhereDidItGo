<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="WhereDidItGo" />
<meta name="application-name" content="WhereDidItGo" />
<meta name="theme-color" content="#040e0e" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#040e0e" />
<meta name="msapplication-TileColor" content="#040e0e" />
<meta name="msapplication-TileImage" content="icon-144.png" />
<title>WhereDidItGo</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png" />
<link rel="apple-touch-icon" sizes="167x167" href="icon-167.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Syne:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root {
  --bg:        #040e0e;
  --bg2:       #071414;
  --surface:   #0c1f1f;
  --surface2:  #122828;
  --surface3:  #183434;
  --border:    rgba(32,210,190,0.1);
  --border2:   rgba(32,210,190,0.18);
  --text:      #e8f5f4;
  --muted:     #5a8a87;
  --muted2:    #3a6a67;
  --teal:      #20d2be;
  --teal2:     #14a896;
  --teal3:     #0d7a6e;
  --aqua:      #5ef0e0;
  --glow:      rgba(32,210,190,0.15);
  --danger:    #ff7070;
  --reimburse: #34e8a0;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: var(--bg); font-family: 'Syne', sans-serif; color: var(--text); }

/* Ambient bg glow */
body::before {
  content: '';
  position: fixed; top: -120px; left: 50%; transform: translateX(-50%);
  width: 600px; height: 400px;
  background: radial-gradient(ellipse, rgba(32,210,190,0.06) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}

.app { display: flex; flex-direction: column; height: 100dvh; max-width: 430px; margin: 0 auto; position: relative; overflow: hidden; }
.statusbar { height: env(safe-area-inset-top, 44px); flex-shrink: 0; }
.content { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-bottom: 106px; position: relative; z-index: 1; }
.content::-webkit-scrollbar { display: none; }

/* Navbar */
.navbar { padding: 6px 20px 14px; display: flex; align-items: center; justify-content: space-between; }
.navbar-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px; font-weight: 300; font-style: italic;
  letter-spacing: 0.5px; color: var(--text);
  line-height: 1;
}
.navbar-title .title-where { color: var(--muted); font-weight: 300; }
.navbar-title .title-did { color: var(--text); font-weight: 400; }
.navbar-title .title-it { color: var(--muted); font-weight: 300; }
.navbar-title .title-go {
  color: var(--teal);
  font-weight: 600; font-style: normal;
  letter-spacing: 1px;
  text-shadow: 0 0 18px rgba(32,210,190,0.45);
}
.cash-fly {
  display: inline-block;
  font-size: 22px;
  margin-left: 7px;
  vertical-align: middle;
  animation: cashfly 3s ease-in-out infinite;
  transform-origin: center;
  filter: drop-shadow(0 0 6px rgba(32,210,190,0.35));
}
@keyframes cashfly {
  0%   { transform: translateY(0px) rotate(-8deg) scale(1); }
  25%  { transform: translateY(-7px) rotate(7deg) scale(1.12); }
  50%  { transform: translateY(-3px) rotate(-5deg) scale(1.05); }
  75%  { transform: translateY(-9px) rotate(9deg) scale(1.14); }
  100% { transform: translateY(0px) rotate(-8deg) scale(1); }
}
.navbar-sub { font-size: 12px; color: var(--muted); margin-top: 2px; letter-spacing: 0.3px; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 12px;
  background: var(--surface2); border: 0.5px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 20px; color: var(--teal);
  box-shadow: 0 0 12px rgba(32,210,190,0.08);
  transition: background 0.2s, box-shadow 0.2s;
}
.icon-btn:active { background: var(--surface3); box-shadow: 0 0 20px rgba(32,210,190,0.18); }

/* Hero */
.hero {
  margin: 0 16px 20px;
  background: var(--surface);
  border: 0.5px solid var(--border2);
  border-radius: 24px;
  padding: 22px 22px 18px;
  position: relative; overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute; top: -60px; right: -60px;
  width: 220px; height: 220px;
  background: radial-gradient(circle, rgba(32,210,190,0.12) 0%, transparent 65%);
  pointer-events: none;
}
.hero::after {
  content: '';
  position: absolute; bottom: -40px; left: -20px;
  width: 140px; height: 140px;
  background: radial-gradient(circle, rgba(94,240,224,0.06) 0%, transparent 65%);
  pointer-events: none;
}
.hero-label {
  font-size: 10px; font-weight: 600; color: var(--teal);
  text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px;
}
.hero-amount {
  font-size: 44px; font-weight: 700; letter-spacing: -2px;
  color: var(--text); font-family: 'JetBrains Mono', monospace;
  line-height: 1;
}
.hero-amount-reimb {
  font-size: 13px; color: var(--reimburse); margin-top: 4px; font-weight: 500;
  display: flex; align-items: center; gap: 4px;
}
.hero-meta { font-size: 12px; color: var(--muted); margin-top: 8px; }
.hero-divider { height: 0.5px; background: var(--border); margin: 14px 0; }
.hero-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.hero-chip {
  display: flex; align-items: center; gap: 5px;
  background: rgba(32,210,190,0.08);
  border: 0.5px solid rgba(32,210,190,0.2);
  border-radius: 20px; padding: 5px 10px;
  font-size: 11px; font-weight: 500; color: var(--aqua);
}

/* Net balance badge */
.net-badge {
  position: absolute; top: 20px; right: 22px;
  background: rgba(52,232,160,0.12);
  border: 0.5px solid rgba(52,232,160,0.3);
  border-radius: 10px; padding: 4px 10px;
  font-size: 11px; font-weight: 600; color: var(--reimburse);
  font-family: 'JetBrains Mono', monospace;
}

/* Category scroll */
.cat-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 4px; margin-bottom: 18px; scrollbar-width: none; }
.cat-scroll::-webkit-scrollbar { display: none; }
.cat-pill {
  flex-shrink: 0; display: flex; align-items: center; gap: 6px;
  padding: 7px 14px; background: var(--surface); border-radius: 20px;
  border: 0.5px solid var(--border); font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all 0.2s; white-space: nowrap; color: var(--muted);
}
.cat-pill.active { background: rgba(32,210,190,0.12); border-color: var(--teal2); color: var(--teal); }

/* Section */
.section { padding: 0 16px; margin-bottom: 24px; }
.section-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 10px; }

/* Transactions */
.tx-group-label { font-size: 11px; color: var(--muted2); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 600; padding-left: 2px; }
.tx-card { background: var(--surface); border-radius: 18px; border: 0.5px solid var(--border); overflow: hidden; margin-bottom: 10px; }
.tx-row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; position: relative; transition: background 0.15s; cursor: pointer; }
.tx-row:active { background: var(--surface2); }
.tx-row:not(:last-child)::after { content: ''; position: absolute; bottom: 0; left: 56px; right: 0; height: 0.5px; background: var(--border); }
.tx-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.tx-info { flex: 1; min-width: 0; }
.tx-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.tx-cat { font-size: 11px; color: var(--muted); margin-top: 1px; }
.tx-right { text-align: right; flex-shrink: 0; }
.tx-amount { font-size: 14px; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
.tx-date { font-size: 10px; color: var(--muted); margin-top: 2px; }

/* Reimbursement special styling */
.tx-amount.reimb { color: var(--reimburse) !important; }
.tx-amount.reimb::before { content: '+'; }

/* Tab bar */
.tabbar {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: calc(62px + env(safe-area-inset-bottom, 16px));
  background: rgba(4,14,14,0.92);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border-top: 0.5px solid var(--border2);
  display: flex; align-items: flex-start; padding-top: 10px; z-index: 10;
}
.tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; padding: 4px; }
.tab-icon { font-size: 20px; transition: transform 0.2s; }
.tab-label { font-size: 10px; font-weight: 600; color: var(--muted2); letter-spacing: 0.5px; transition: color 0.2s; }
.tab-item.active .tab-label { color: var(--teal); }
.tab-item.active .tab-icon { transform: scale(1.12); }
.tab-add { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
.add-fab {
  width: 50px; height: 50px; border-radius: 16px;
  background: var(--teal); display: flex; align-items: center;
  justify-content: center; font-size: 26px; color: #020e0e;
  margin-top: -22px;
  box-shadow: 0 0 0 6px rgba(32,210,190,0.08), 0 0 28px rgba(32,210,190,0.3);
  transition: transform 0.15s, box-shadow 0.15s;
  font-weight: 700;
}
.add-fab:active { transform: scale(0.92); box-shadow: 0 0 0 4px rgba(32,210,190,0.06), 0 0 16px rgba(32,210,190,0.2); }
.tab-label-add { font-size: 10px; font-weight: 600; color: var(--teal); letter-spacing: 0.5px; }

/* Screens */
.screen { display: none; }
.screen.active { display: block; }

/* Sheet */
.sheet-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.sheet-overlay.open { opacity: 1; pointer-events: all; }
.sheet {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: var(--surface); border-radius: 28px 28px 0 0;
  z-index: 101; padding: 0 20px calc(40px + env(safe-area-inset-bottom, 0px));
  transform: translateY(100%);
  transition: transform 0.4s cubic-bezier(0.32,0.72,0,1);
  max-height: 92dvh; overflow-y: auto;
  border-top: 0.5px solid var(--border2);
}
.sheet.open { transform: translateY(0); }
.sheet-handle { width: 32px; height: 4px; background: var(--surface3); border-radius: 2px; margin: 14px auto 22px; }
.sheet-title { font-size: 20px; font-weight: 700; margin-bottom: 24px; text-align: center; color: var(--text); }

/* Amount input */
.amount-input-wrap { text-align: center; margin-bottom: 28px; position: relative; }
.amount-input-wrap::after {
  content: '';
  display: block; width: 80px; height: 2px;
  background: linear-gradient(90deg, transparent, var(--teal), transparent);
  margin: 8px auto 0;
  border-radius: 1px;
}
.currency-prefix { font-size: 26px; color: var(--teal); font-family: 'JetBrains Mono', monospace; vertical-align: middle; }
.amount-input {
  font-size: 50px; font-weight: 700; font-family: 'JetBrains Mono', monospace;
  background: transparent; border: none; color: var(--text);
  outline: none; width: 220px; text-align: center;
  caret-color: var(--teal); vertical-align: middle;
}
.amount-input::placeholder { color: rgba(32,210,190,0.2); }

/* Form fields */
.form-field { margin-bottom: 14px; }
.form-field label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600; display: block; margin-bottom: 7px; }
.form-field input, .form-field select {
  width: 100%; background: var(--surface2); border: 0.5px solid var(--border);
  border-radius: 14px; padding: 14px 16px; font-size: 15px;
  color: var(--text); font-family: 'Syne', sans-serif; outline: none;
  appearance: none; -webkit-appearance: none; transition: border-color 0.2s;
}
.form-field input:focus, .form-field select:focus { border-color: var(--teal2); }
.form-field select option { background: #0c1f1f; }

/* Cat grid */
.cat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.cat-btn {
  background: var(--surface2); border: 0.5px solid var(--border);
  border-radius: 14px; padding: 10px 4px; text-align: center;
  cursor: pointer; transition: all 0.18s;
}
.cat-btn.selected {
  border-color: var(--teal); background: rgba(32,210,190,0.1);
  box-shadow: 0 0 12px rgba(32,210,190,0.12);
}
.cat-btn .emoji { font-size: 20px; display: block; margin-bottom: 4px; }
.cat-btn .cname { font-size: 9px; color: var(--muted); font-weight: 600; letter-spacing: 0.3px; }
.cat-btn.selected .cname { color: var(--teal); }

/* Reimburse special cat btn */
.cat-btn.reimb-btn.selected { border-color: var(--reimburse); background: rgba(52,232,160,0.1); box-shadow: 0 0 12px rgba(52,232,160,0.12); }
.cat-btn.reimb-btn.selected .cname { color: var(--reimburse); }

.submit-btn {
  width: 100%;
  background: var(--teal); border: none; border-radius: 16px;
  padding: 16px; font-size: 16px; font-weight: 700; color: #020e0e;
  cursor: pointer; margin-top: 22px; font-family: 'Syne', sans-serif;
  letter-spacing: 0.3px;
  box-shadow: 0 0 24px rgba(32,210,190,0.25);
  transition: opacity 0.15s, transform 0.15s, box-shadow 0.15s;
}
.submit-btn:active { opacity: 0.85; transform: scale(0.98); box-shadow: 0 0 12px rgba(32,210,190,0.15); }

/* Reports */
.chart-container {
  background: var(--surface); border-radius: 18px;
  border: 0.5px solid var(--border); padding: 16px; margin-bottom: 14px;
}
.chart-label { font-size: 11px; color: var(--muted); margin-bottom: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
.donut-wrap { position: relative; height: 200px; }
.donut-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; pointer-events: none; }
.donut-center-val { font-size: 20px; font-weight: 700; font-family: 'JetBrains Mono', monospace; color: var(--text); }
.donut-center-label { font-size: 10px; color: var(--muted); margin-top: 2px; letter-spacing: 0.5px; text-transform: uppercase; }

.cat-breakdown { display: flex; flex-direction: column; gap: 13px; }
.cat-breakdown-row { display: flex; align-items: center; gap: 10px; }
.cat-breakdown-icon { font-size: 18px; width: 34px; height: 34px; background: var(--surface2); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.cat-breakdown-info { flex: 1; }
.cat-breakdown-top { display: flex; justify-content: space-between; font-size: 13px; font-weight: 500; margin-bottom: 5px; }
.cat-breakdown-bar { height: 3px; background: var(--surface3); border-radius: 2px; overflow: hidden; }
.cat-breakdown-fill { height: 100%; border-radius: 2px; transition: width 0.7s cubic-bezier(0.34,1.56,0.64,1); }
.cat-pct { font-size: 12px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }

/* Stat row */
.stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 16px 14px; }
.stat-card { background: var(--surface); border-radius: 16px; border: 0.5px solid var(--border); padding: 14px 15px; }
.stat-card-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600; margin-bottom: 7px; }
.stat-card-val { font-size: 20px; font-weight: 700; font-family: 'JetBrains Mono', monospace; color: var(--teal); }
.stat-card-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }

/* Reimburse stat card */
.stat-card.reimb-card { border-color: rgba(52,232,160,0.2); background: rgba(52,232,160,0.04); }
.stat-card.reimb-card .stat-card-val { color: var(--reimburse); }

/* Toast */
.toast { position: absolute; top: calc(env(safe-area-inset-top, 44px) + 12px); left: 50%; transform: translateX(-50%) translateY(-80px); background: var(--surface3); border: 0.5px solid var(--border2); color: var(--teal); padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 600; z-index: 200; transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1); white-space: nowrap; box-shadow: 0 0 20px rgba(32,210,190,0.15); letter-spacing: 0.3px; }
.toast.show { transform: translateX(-50%) translateY(0); }

/* Empty */
.empty { text-align: center; padding: 44px 24px; }
.empty-icon { font-size: 44px; margin-bottom: 12px; }
.empty-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; color: var(--text); }
.empty-sub { font-size: 13px; color: var(--muted); line-height: 1.6; }

.bar-wrap { position: relative; height: 160px; }

/* Teal line accent on section heading */
.section-head-accent { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.section-head-accent::before { content: ''; width: 3px; height: 14px; background: var(--teal); border-radius: 2px; display: block; }
.section-head-accent .section-title { margin-bottom: 0; }

/* Person picker */
.person-grid { display: flex; gap: 8px; }
.person-btn {
  flex: 1; background: var(--surface2); border: 0.5px solid var(--border);
  border-radius: 14px; padding: 10px 6px; text-align: center;
  cursor: pointer; transition: all 0.18s;
}
.person-btn.selected {
  border-color: var(--teal); background: rgba(32,210,190,0.1);
  box-shadow: 0 0 12px rgba(32,210,190,0.12);
}
.person-btn .p-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; margin: 0 auto 5px;
  background: var(--surface3); color: var(--teal);
}
.person-btn.selected .p-avatar { background: rgba(32,210,190,0.2); }
.person-btn .p-name { font-size: 10px; color: var(--muted); font-weight: 600; letter-spacing: 0.3px; }
.person-btn.selected .p-name { color: var(--teal); }

/* Report filter bar */
.report-filters { padding: 0 16px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
.filter-row { display: flex; align-items: center; gap: 8px; }
.filter-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; flex-shrink: 0; min-width: 60px; }
.filter-chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1; }
.filter-chips::-webkit-scrollbar { display: none; }
.filter-chip {
  flex-shrink: 0; padding: 5px 12px; border-radius: 16px;
  background: var(--surface); border: 0.5px solid var(--border);
  font-size: 12px; font-weight: 500; color: var(--muted); cursor: pointer;
  transition: all 0.18s; white-space: nowrap;
}
.filter-chip.active { background: rgba(32,210,190,0.12); border-color: var(--teal2); color: var(--teal); }

.tx-del-btn {
  background: none; border: none; cursor: pointer;
  color: #5a8a87; padding: 6px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.2s, background 0.15s, color 0.15s;
  flex-shrink: 0; margin-left: 4px;
}
.tx-row:hover .tx-del-btn,
.tx-row:active .tx-del-btn { opacity: 1; }
.tx-del-btn:hover { background: rgba(255,100,100,0.12); color: #ff7070; }
@media (hover: none) { .tx-del-btn { opacity: 0.55; } }
</style>
</head>
<body>
<div class="app">
  <div class="statusbar"></div>
  <div class="toast" id="toast"></div>

  <!-- HOME -->
  <div id="screen-home" class="screen active">
    <div class="content">
      <div class="navbar">
        <div>
          <div class="navbar-title"><span class="title-where">Where</span><span class="title-did">Did</span><span class="title-it">It</span><span class="title-go">Go</span><span class="cash-fly">💸</span></div>
          <div class="navbar-sub" id="home-subtitle">—</div>
        </div>
        <div class="icon-btn" onclick="openAdd()">＋</div>
      </div>

      <div class="hero">
        <div class="hero-label">Total This Month</div>
        <div class="hero-amount" id="hero-amount">₹0</div>
        <div class="hero-amount-reimb" id="hero-reimb" style="display:none">
          <span>↩</span><span id="hero-reimb-val"></span> to be reimbursed
        </div>
        <div class="hero-meta" id="hero-meta">0 transactions</div>
        <div id="net-badge" class="net-badge" style="display:none"></div>
        <div class="hero-divider"></div>
        <div class="hero-chips" id="hero-chips"></div>
      </div>

      <div class="cat-scroll" id="cat-filter"></div>

      <div class="section">
        <div id="tx-feed"></div>
      </div>
    </div>
  </div>

  <!-- REPORTS -->
  <div id="screen-report" class="screen">
    <div class="content">
      <div class="navbar">
        <div>
          <div class="navbar-title">Reports</div>
          <div class="navbar-sub" id="report-subtitle">Spending insights</div>
        </div>
      </div>
      <div class="report-filters">
        <div class="filter-row">
          <span class="filter-label">Added by</span>
          <div class="filter-chips" id="rpt-person-filter"></div>
        </div>
        <div class="filter-row">
          <span class="filter-label">Category</span>
          <div class="filter-chips" id="rpt-cat-filter"></div>
        </div>
      </div>
      <div class="stat-row" id="stat-row"></div>
      <div class="section">
        <div class="chart-container">
          <div class="chart-label">Spending by category</div>
          <div class="donut-wrap">
            <canvas id="donut-chart" role="img" aria-label="Donut chart of category spending">Category spending breakdown.</canvas>
            <div class="donut-center">
              <div class="donut-center-val" id="donut-center-val">₹0</div>
              <div class="donut-center-label">spent</div>
            </div>
          </div>
        </div>
        <div class="chart-container">
          <div class="chart-label" id="trend-chart-label">Daily trend</div>
          <div class="bar-wrap">
            <canvas id="bar-chart" role="img" aria-label="Spending trend chart">Spending trend.</canvas>
          </div>
        </div>
        <div class="chart-container">
          <div class="chart-label">Category breakdown</div>
          <div class="cat-breakdown" id="cat-breakdown"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ADD SHEET -->
  <div class="sheet-overlay" id="sheet-overlay" onclick="closeAdd()"></div>
  <div class="sheet" id="add-sheet">
    <div class="sheet-handle"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
      <div onclick="closeAdd()" style="width:36px;height:36px;border-radius:12px;background:var(--surface2);border:0.5px solid var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--teal);">←</div>
      <div class="sheet-title" style="margin-bottom:0">New Expense</div>
      <div style="width:36px"></div>
    </div>
    <div class="amount-input-wrap">
      <span class="currency-prefix">₹</span><input class="amount-input" id="inp-amount" type="number" inputmode="decimal" placeholder="0" min="0" />
    </div>
    <div class="form-field">
      <label>Description</label>
      <input id="inp-desc" type="text" placeholder="What did you spend on?" maxlength="40" />
    </div>
    <div class="form-field" style="margin-bottom:8px"><label>Category</label></div>
    <div class="cat-grid" id="cat-grid"></div>
    <div class="form-field" style="margin-top:16px">
      <label>Date</label>
      <input id="inp-date" type="date" />
    </div>
    <div class="form-field">
      <label>Added by</label>
      <div class="person-grid" id="person-grid"></div>
    </div>
    <button class="submit-btn" onclick="addExpense()">Save Expense</button>
  </div>

  <!-- TAB BAR -->
  <div class="tabbar">
    <div class="tab-item active" id="tab-home" onclick="switchTab('home')">
      <div class="tab-icon">🏠</div>
      <div class="tab-label">HOME</div>
    </div>
    <div class="tab-add" onclick="openAdd()">
      <div class="add-fab">＋</div>
      <div class="tab-label-add">ADD</div>
    </div>
    <div class="tab-item" id="tab-report" onclick="switchTab('report')">
      <div class="tab-icon">📊</div>
      <div class="tab-label">REPORTS</div>
    </div>
  </div>
</div>

<script>
const CATS = [
  { id:'food',    label:'Food',       emoji:'🍽️', color:'#20d2be' },
  { id:'travel',  label:'Travel',     emoji:'✈️',  color:'#5ef0e0' },
  { id:'shop',    label:'Shopping',   emoji:'🛍️', color:'#f6ad55' },
  { id:'health',  label:'Health',     emoji:'💊',  color:'#68d391' },
  { id:'entmt',   label:'Fun',        emoji:'🎬',  color:'#a78bfa' },
  { id:'bills',   label:'Bills',      emoji:'💡',  color:'#63b3ed' },
  { id:'grocry',  label:'Grocery',    emoji:'🛒',  color:'#fbd38d' },
  { id:'other',   label:'Other',      emoji:'📦',  color:'#94a3b8' },
  { id:'reimb',   label:'Reimburse',  emoji:'↩️',  color:'#34e8a0', isReimb: true }
];

const PERSONS = [
  { id:'nazish', label:'Nazish', initials:'NA' },
  { id:'arshad', label:'Arshad', initials:'AR' },
  { id:'others', label:'Others', initials:'OT' }
];

let expenses = [];
let selectedCat = 'all';
let sheetCat = 'food';
let sheetPerson = 'nazish';
let donutChart = null, barChart = null;
let rptPersonFilter = 'all';
let rptCatFilter = 'all';

function loadData() {
  try { expenses = JSON.parse(localStorage.getItem('spends_v2') || '[]'); } catch(e) { expenses = []; }
}
function saveData() {
  try { localStorage.setItem('spends_v2', JSON.stringify(expenses)); } catch(e) {}
}
function fmt(n) { return '₹' + Math.round(Math.abs(n)).toLocaleString('en-IN'); }
function fmtDate(d) {
  return new Date(d + 'T00:00:00').toLocaleDateString('en-IN', { day:'numeric', month:'short' });
}
function thisMonth() {
  const n = new Date();
  return n.getFullYear() + '-' + String(n.getMonth()+1).padStart(2,'0');
}
function getCat(id) { return CATS.find(c => c.id === id) || CATS[7]; }
function getPerson(id) { return PERSONS.find(p => p.id === id) || PERSONS[2]; }

function renderHome() {
  const month = thisMonth();
  const me = expenses.filter(e => e.date.startsWith(month));
  const spentExpenses = me.filter(e => e.cat !== 'reimb');
  const reimbExpenses = me.filter(e => e.cat === 'reimb');
  const total = spentExpenses.reduce((s,e) => s+e.amt, 0);
  const reimbTotal = reimbExpenses.reduce((s,e) => s+e.amt, 0);
  const net = total - reimbTotal;
  const n = new Date();
  const monthName = n.toLocaleString('en-IN', { month:'long', year:'numeric' });

  document.getElementById('home-subtitle').textContent = monthName;
  document.getElementById('hero-amount').textContent = fmt(total);
  document.getElementById('hero-meta').textContent = me.length + ' transaction' + (me.length !== 1 ? 's' : '');

  const reimbEl = document.getElementById('hero-reimb');
  const reimbValEl = document.getElementById('hero-reimb-val');
  if (reimbTotal > 0) {
    reimbEl.style.display = 'flex';
    reimbValEl.textContent = fmt(reimbTotal);
    const nb = document.getElementById('net-badge');
    nb.style.display = 'block';
    nb.textContent = 'Net ' + fmt(net);
  } else {
    reimbEl.style.display = 'none';
    document.getElementById('net-badge').style.display = 'none';
  }

  const byCat = {};
  spentExpenses.forEach(e => { byCat[e.cat] = (byCat[e.cat]||0)+e.amt; });
  const topCats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,3);
  document.getElementById('hero-chips').innerHTML = topCats.map(([cid, val]) => {
    const c = getCat(cid);
    return `<span class="hero-chip">${c.emoji} ${fmt(val)}</span>`;
  }).join('');

  const filterEl = document.getElementById('cat-filter');
  filterEl.innerHTML = `<div class="cat-pill ${selectedCat==='all'?'active':''}" onclick="filterCat('all')">All</div>`
    + CATS.map(c => `<div class="cat-pill ${selectedCat===c.id?'active':''}" onclick="filterCat('${c.id}')">${c.emoji} ${c.label}</div>`).join('');

  const filtered = selectedCat === 'all' ? [...expenses] : expenses.filter(e => e.cat === selectedCat);
  const feed = document.getElementById('tx-feed');

  if (!filtered.length) {
    feed.innerHTML = `<div class="empty"><div class="empty-icon">🌊</div><div class="empty-title">Nothing here yet</div><div class="empty-sub">Tap + to log your first expense and start seeing where your money flows.</div></div>`;
    return;
  }

  const today = new Date().toISOString().slice(0,10);
  const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
  const groups = {};
  filtered.slice(0,60).forEach(e => {
    const g = e.date === today ? 'Today' : e.date === yesterday ? 'Yesterday' : fmtDate(e.date);
    if (!groups[g]) groups[g] = [];
    groups[g].push(e);
  });

  feed.innerHTML = Object.entries(groups).map(([grp, items]) => `
    <div class="tx-group-label">${grp}</div>
    <div class="tx-card">
      ${items.map(e => {
        const c = getCat(e.cat);
        const p = getPerson(e.person || 'others');
        const isReimb = e.cat === 'reimb';
        return `<div class="tx-row" id="txrow-${e.id}">
          <div class="tx-icon" style="background:${c.color}18">${c.emoji}</div>
          <div class="tx-info">
            <div class="tx-name">${e.desc}</div>
            <div class="tx-cat">${c.label} · ${p.label}</div>
          </div>
          <div class="tx-right">
            <div class="tx-amount ${isReimb?'reimb':''}" style="color:${c.color}">${fmt(e.amt)}</div>
            <div class="tx-date">${fmtDate(e.date)}</div>
          </div>
          <button class="tx-del-btn" onclick="deleteExpense(${e.id}, event)" aria-label="Delete expense">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          </button>
        </div>`;
      }).join('')}
    </div>`).join('');
}

function filterCat(id) { selectedCat = id; renderHome(); }

function deleteExpense(id, evt) {
  evt.stopPropagation();
  const row = document.getElementById('txrow-' + id);
  if (row) {
    row.style.transition = 'all 0.3s ease';
    row.style.opacity = '0';
    row.style.transform = 'translateX(40px)';
    row.style.maxHeight = row.offsetHeight + 'px';
    setTimeout(() => {
      row.style.maxHeight = '0';
      row.style.padding = '0';
      row.style.overflow = 'hidden';
    }, 200);
    setTimeout(() => {
      expenses = expenses.filter(e => e.id !== id);
      saveData(); renderHome(); showToast('Deleted ✓');
    }, 480);
  }
}

function buildCatGrid() {
  document.getElementById('cat-grid').innerHTML = CATS.map(c =>
    `<div class="cat-btn ${c.isReimb?'reimb-btn':''} ${c.id===sheetCat?'selected':''}" onclick="selectCat('${c.id}')">
      <span class="emoji">${c.emoji}</span>
      <span class="cname">${c.label}</span>
    </div>`).join('');
}
function selectCat(id) { sheetCat = id; buildCatGrid(); }

function buildPersonGrid() {
  document.getElementById('person-grid').innerHTML = PERSONS.map(p =>
    `<div class="person-btn ${p.id===sheetPerson?'selected':''}" onclick="selectPerson('${p.id}')">
      <div class="p-avatar">${p.initials}</div>
      <div class="p-name">${p.label}</div>
    </div>`).join('');
}
function selectPerson(id) { sheetPerson = id; buildPersonGrid(); }

function openAdd() {
  document.getElementById('sheet-overlay').classList.add('open');
  document.getElementById('add-sheet').classList.add('open');
  document.getElementById('inp-date').value = new Date().toISOString().slice(0,10);
  buildCatGrid();
  buildPersonGrid();
  setTimeout(() => document.getElementById('inp-amount').focus(), 420);
}
function closeAdd() {
  document.getElementById('sheet-overlay').classList.remove('open');
  document.getElementById('add-sheet').classList.remove('open');
  document.getElementById('inp-amount').value = '';
  document.getElementById('inp-desc').value = '';
}
function addExpense() {
  const amt = parseFloat(document.getElementById('inp-amount').value);
  const desc = document.getElementById('inp-desc').value.trim();
  const date = document.getElementById('inp-date').value;
  if (!amt || amt <= 0) { showToast('Enter a valid amount'); return; }
  if (!desc) { showToast('Add a description'); return; }
  expenses.unshift({ id: Date.now(), amt, desc, cat: sheetCat, date, person: sheetPerson });
  saveData(); closeAdd(); renderHome();
  showToast(sheetCat === 'reimb' ? 'Reimbursement logged ↩' : 'Expense saved ✓');
}

function buildReportFilters() {
  // Person filter
  document.getElementById('rpt-person-filter').innerHTML =
    `<div class="filter-chip ${rptPersonFilter==='all'?'active':''}" onclick="setRptPerson('all')">All</div>`
    + PERSONS.map(p => `<div class="filter-chip ${rptPersonFilter===p.id?'active':''}" onclick="setRptPerson('${p.id}')">${p.label}</div>`).join('');
  // Cat filter
  document.getElementById('rpt-cat-filter').innerHTML =
    `<div class="filter-chip ${rptCatFilter==='all'?'active':''}" onclick="setRptCat('all')">All</div>`
    + CATS.filter(c => !c.isReimb).map(c => `<div class="filter-chip ${rptCatFilter===c.id?'active':''}" onclick="setRptCat('${c.id}')">${c.emoji} ${c.label}</div>`).join('');
}
function setRptPerson(id) { rptPersonFilter = id; renderReport(); }
function setRptCat(id) { rptCatFilter = id; renderReport(); }

function renderReport() {
  buildReportFilters();

  // Apply filters
  let base = [...expenses];
  if (rptPersonFilter !== 'all') base = base.filter(e => (e.person || 'others') === rptPersonFilter);

  const month = thisMonth();
  const me = base.filter(e => e.date.startsWith(month));
  const spentMe = me.filter(e => e.cat !== 'reimb');
  const reimbMe = me.filter(e => e.cat === 'reimb');

  // Apply cat filter for trend + stat only (not donut which shows all cats)
  const catFiltered = rptCatFilter === 'all' ? spentMe : spentMe.filter(e => e.cat === rptCatFilter);

  const total = spentMe.reduce((s,e) => s+e.amt, 0);
  const reimbTotal = reimbMe.reduce((s,e) => s+e.amt, 0);
  const net = total - reimbTotal;
  const filteredTotal = catFiltered.reduce((s,e) => s+e.amt, 0);
  const n = new Date();

  const personLabel = rptPersonFilter === 'all' ? 'Everyone' : getPerson(rptPersonFilter).label;
  const catLabel = rptCatFilter === 'all' ? 'All categories' : getCat(rptCatFilter).label;
  document.getElementById('report-subtitle').textContent = personLabel + ' · ' + catLabel;
  document.getElementById('donut-center-val').textContent = fmt(rptCatFilter === 'all' ? total : filteredTotal);

  const byCat = {};
  spentMe.forEach(e => { byCat[e.cat] = (byCat[e.cat]||0)+e.amt; });
  const topCatEntry = Object.entries(byCat).sort((a,b)=>b[1]-a[1])[0];
  const avg = catFiltered.length ? filteredTotal/catFiltered.length : 0;

  document.getElementById('stat-row').innerHTML = `
    <div class="stat-card">
      <div class="stat-card-label">${rptCatFilter==='all'?'Total Spent':getCat(rptCatFilter).label+' Spent'}</div>
      <div class="stat-card-val">${fmt(filteredTotal)}</div>
      <div class="stat-card-sub">${catFiltered.length} entries</div>
    </div>
    <div class="stat-card reimb-card">
      <div class="stat-card-label">Reimbursements</div>
      <div class="stat-card-val">${fmt(reimbTotal)}</div>
      <div class="stat-card-sub">Net: ${fmt(net)}</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-label">Top Category</div>
      <div class="stat-card-val">${topCatEntry ? getCat(topCatEntry[0]).emoji : '—'}</div>
      <div class="stat-card-sub">${topCatEntry ? getCat(topCatEntry[0]).label+' · '+fmt(topCatEntry[1]) : 'No data'}</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-label">Avg Expense</div>
      <div class="stat-card-val">${fmt(avg)}</div>
      <div class="stat-card-sub">per transaction</div>
    </div>
  `;

  // Donut — always shows all cats (unfiltered by cat, but filtered by person)
  const sorted = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const labels = sorted.map(([id]) => getCat(id).label);
  const vals = sorted.map(([,v]) => v);
  const colors = sorted.map(([id]) => getCat(id).color);

  if (donutChart) donutChart.destroy();
  if (spentMe.length) {
    donutChart = new Chart(document.getElementById('donut-chart'), {
      type: 'doughnut',
      data: { labels, datasets: [{ data: vals, backgroundColor: colors, borderWidth: 0, hoverOffset: 6 }] },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '72%',
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${fmt(ctx.raw)}` } } }
      }
    });
  }

  // Trend chart — daily if all cats, monthly (last 6 months) if specific cat selected
  if (barChart) barChart.destroy();
  if (rptCatFilter === 'all') {
    // Daily trend for current month
    document.getElementById('trend-chart-label').textContent = 'Daily trend — ' + n.toLocaleString('en-IN',{month:'long'});
    const days = n.getDate();
    const dayLabels = [], dayVals = [];
    for (let d = 1; d <= days; d++) {
      const key = month + '-' + String(d).padStart(2,'0');
      dayLabels.push(d);
      dayVals.push(Math.round(catFiltered.filter(e => e.date===key).reduce((s,e)=>s+e.amt,0)));
    }
    const barColor = '#20d2be';
    barChart = new Chart(document.getElementById('bar-chart'), {
      type: 'bar',
      data: { labels: dayLabels, datasets: [{ data: dayVals, backgroundColor: dayVals.map(v => v>0?barColor:'#122828'), borderRadius: 4 }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend:{display:false}, tooltip:{callbacks:{label: ctx => fmt(ctx.raw)}} },
        scales: {
          x: { ticks:{color:'#5a8a87',font:{size:10},maxRotation:0}, grid:{display:false}, border:{display:false} },
          y: { ticks:{color:'#5a8a87',font:{size:10},callback: v => v>=1000?'₹'+(v/1000).toFixed(0)+'k':'₹'+v}, grid:{color:'rgba(32,210,190,0.05)'}, border:{display:false} }
        }
      }
    });
  } else {
    // Monthly trend for selected category — last 6 months
    const cat = getCat(rptCatFilter);
    document.getElementById('trend-chart-label').textContent = cat.emoji + ' ' + cat.label + ' — monthly trend';
    const monthLabels = [], monthVals = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date(n.getFullYear(), n.getMonth()-i, 1);
      const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
      monthLabels.push(d.toLocaleString('en-IN',{month:'short'}));
      const personBase = rptPersonFilter === 'all' ? expenses : expenses.filter(e => (e.person||'others')===rptPersonFilter);
      monthVals.push(Math.round(personBase.filter(e => e.date.startsWith(key) && e.cat===rptCatFilter).reduce((s,e)=>s+e.amt,0)));
    }
    barChart = new Chart(document.getElementById('bar-chart'), {
      type: 'bar',
      data: { labels: monthLabels, datasets: [{ data: monthVals, backgroundColor: monthVals.map(v => v>0?cat.color:'#122828'), borderRadius: 6 }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend:{display:false}, tooltip:{callbacks:{label: ctx => fmt(ctx.raw)}} },
        scales: {
          x: { ticks:{color:'#5a8a87',font:{size:11},maxRotation:0}, grid:{display:false}, border:{display:false} },
          y: { ticks:{color:'#5a8a87',font:{size:10},callback: v => v>=1000?'₹'+(v/1000).toFixed(0)+'k':'₹'+v}, grid:{color:'rgba(32,210,190,0.05)'}, border:{display:false} }
        }
      }
    });
  }

  const maxVal = sorted[0]?.[1] || 1;
  document.getElementById('cat-breakdown').innerHTML = sorted.length
    ? sorted.map(([id,val]) => {
        const c = getCat(id);
        const isHighlighted = rptCatFilter === 'all' || rptCatFilter === id;
        return `<div class="cat-breakdown-row" style="opacity:${isHighlighted?1:0.35}">
          <div class="cat-breakdown-icon">${c.emoji}</div>
          <div class="cat-breakdown-info">
            <div class="cat-breakdown-top"><span>${c.label}</span><span>${fmt(val)} <span class="cat-pct">${Math.round(val/total*100)}%</span></span></div>
            <div class="cat-breakdown-bar"><div class="cat-breakdown-fill" style="width:${Math.round(val/maxVal*100)}%;background:${c.color}"></div></div>
          </div>
        </div>`;
      }).join('')
    : '<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px 0">No spending data this month</div>';
}

function switchTab(tab) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-'+tab).classList.add('active');
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-'+tab)?.classList.add('active');
  if (tab === 'report') renderReport();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

loadData();
renderHome();
document.getElementById('inp-date').value = new Date().toISOString().slice(0,10);
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      nw.addEventListener('statechange', () => {
        if (nw.state === 'installed' && navigator.serviceWorker.controller) showToast('App updated!');
      });
    });
  }).catch(()=>{});
}

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  const btn = document.getElementById('install-btn');
  if (btn) btn.style.display = 'flex';
});
window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  const btn = document.getElementById('install-btn');
  if (btn) btn.style.display = 'none';
  showToast('App installed!');
});
function installApp() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
}
</script>
</body>
</html>
