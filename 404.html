<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script>
  // GitHub Pages PWA fix — redirect all 404s back to the app
  var path = window.location.pathname;
  var query = window.location.search;
  var hash = window.location.hash;
  var redirectUrl = '/WhereDidItGo/' + '?p=' + encodeURIComponent(path + query) + hash;
  window.location.replace(redirectUrl);
</script>
</head>
<body></body>
</html>
